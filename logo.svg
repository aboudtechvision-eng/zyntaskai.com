<svg xmlns="http://www.w3.org/2000/svg" width="148" height="40" viewBox="0 0 148 40" role="img" aria-label="GrowAI logo">
  <defs>
    <linearGradient id="gArrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <!-- mark: black squircle -->
  <rect x="0" y="0" width="40" height="40" rx="11" fill="#111111"/>
  <!-- growth line -->
  <path d="M9 26.5 L16.5 19 L21.5 22 L30 12.5"
        fill="none" stroke="url(#gArrow)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head -->
  <path d="M25.2 12.5 H30 V17.3"
        fill="none" stroke="#4ade80" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="48" y="27.5"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="800" letter-spacing="-0.8" fill="#111111">Grow<tspan fill="#16a34a">AI</tspan><tspan fill="#111111">.</tspan></text>
</svg>
